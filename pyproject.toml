[project]
name = "personal-website"
version = "0.1.0"
description = "Matthias Schoettle's personal website"
readme = "README.md"
requires-python = "==3.14.8"
dependencies = [
    "zensical==0.0.71",
]

[dependency-groups]
dev = [
    "prek==0.5.5",
]

# https://docs.astral.sh/uv/reference/settings/#configuration
[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"
exclude-newer-package = { zensical = "1 day" }
